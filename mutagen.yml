sync:
  defaults:
    alpha: "."
    ignore:
      vcs: "true"
      paths:
        - ".cache"
        - ".claude"
        - ".llm"
        - ".vs"
        - "*.dSYM"
        - "*.vcxproj.user"
        - ".mcp.json"
        - ".DS_Store"
        - "CLAUDE.md"
        - "doc"
        # build artifacts
        - "**/*.o"
        - "**/*.a"
        - "**/*.obj"
        - "**/*.exe"
        - "**/*.dll"
        - "**/*.pdb"
        - "**/*.lib"
        - "**/*.exp"
        - "**/*.ilk"
        - "**/*.dylib"
        - "**/*.pod"
        - "**/*.tcov"
        - "**/*.log"
        - "build/"
        - "config*.h"
        - "config*.mak"
        - "config.texi"
        - "conftest*"
        - "*_.h"
        - "c2str"
        - "c2str.exe"
        - "tcc"
        - "tcc_g"
        - "tcc-doc.html"
        - "tcc-doc.info"
        - "tcc.1"
        - "libtcc*.def"
        - "compile_commands.json"
        - "tests/**/*.out*"
        - "tests/**/*.ref"
        - "tests/**/*.txt"
        - "tests/**/*.gcc"
  piotr:
    beta: "spader@piotr:/Users/spader/source/tinycc"
